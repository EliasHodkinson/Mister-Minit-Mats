<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mister Minit Mat Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#182a48; --navy-2:#0f1d36; --red:#c4202e; --red-bright:#e63946;
    --ink:#1b2333; --muted:#6b7280; --line:#e3e6ec; --bg:#f3f4f7; --card:#ffffff;
    --accent:#1e5fa8; --ok:#1a8a3a; --warn:#d3892d;
    --font:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --topbar-h:48px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font)}
  button,input,select,textarea{font:inherit;color:inherit}
  input[type=text],textarea,select{
    width:100%;border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:#fff;
    transition:border-color .12s, box-shadow .12s;
  }
  input[type=text]:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(30,95,168,.15)}
  textarea{resize:vertical;min-height:40px;line-height:1.35}
  .btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
  .btn:hover{border-color:#c5cad6;background:#fafbfd}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.primary{background:var(--red);border-color:var(--red);color:#fff}
  .btn.primary:hover{background:#a81a27}
  .btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
  .btn.navy:hover{background:var(--navy-2)}
  .btn.small{padding:4px 9px;font-size:12px;border-radius:6px}
  .btn.ghost{border-color:transparent;background:transparent}
  .btn.ghost:hover{background:rgba(0,0,0,.05)}
  .btn.danger:hover{color:var(--red);border-color:var(--red)}

  /* top bar */
  .topbar{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 2px 10px rgba(0,0,0,.2)}
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand b{font-weight:800;letter-spacing:.03em;text-transform:uppercase;font-size:16px}
  .brand span{color:#9fb0cc;font-size:12px}
  .brand .tag{color:var(--red-bright);font-style:italic;font-weight:600}
  .topbar .spacer{flex:1}
  .topbar .btn{border-color:rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff}
  .topbar .btn:hover{background:rgba(255,255,255,.16)}
  .topbar .btn.primary{background:var(--red);border-color:var(--red)}
  .topbar .btn.primary:hover{background:#e0303f}
  .pill{background:rgba(255,255,255,.12);border-radius:999px;padding:4px 11px;font-size:12px;color:#dce4f2}
  .pill b{color:#fff}
  .pill.changes{background:var(--warn);color:var(--navy)}
  .pill.changes b{color:var(--navy)}

  @media (max-width:700px){ .topbar{padding:8px 12px;gap:8px} .topbar .btn{padding:5px 9px;font-size:13px} #pill-store{display:none} }

  /* layout */
  .layout{display:grid;grid-template-columns:230px minmax(0,1fr) 400px;gap:20px;padding:20px;max-width:1600px;margin:0 auto}
  .form{min-width:0}
  @media (max-width:1200px){ .layout{grid-template-columns:230px minmax(0,1fr)} .preview{display:none} }
  @media (max-width:1000px){ .layout{grid-template-columns:minmax(0,1fr);padding:14px} }

  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:16px;box-shadow:0 1px 2px rgba(20,30,60,.04)}
  .card .body{padding:14px 16px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
  .dot.changed{background:var(--warn)} .dot.new{background:var(--ok)} .dot.red{background:var(--red-bright)}
  .muted{color:var(--muted)}

  /* stepper – a vertical list of steps on the left; becomes a horizontal strip on small screens */
  .stepper{position:sticky;top:calc(var(--topbar-h) + 20px);align-self:start;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;z-index:10;box-shadow:0 1px 2px rgba(20,30,60,.04)}
  .steps-title{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:4px 8px 8px}
  .steps{display:flex;flex-direction:column;gap:2px}
  .step-btn{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:none;border-radius:8px;background:transparent;cursor:pointer;color:var(--muted);font-weight:500;font-size:13px;text-align:left;line-height:1.25}
  .step-btn:hover{background:var(--bg);color:var(--ink)}
  .step-btn .n{width:24px;height:24px;border-radius:50%;border:2px solid #cfd4de;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none;line-height:1}
  .step-btn .t{flex:1;min-width:0}
  .step-btn .s{display:block;font-size:11px;font-weight:500;color:var(--muted);margin-top:1px}
  .step-btn.done{color:var(--ink)}
  .step-btn.done .n{background:var(--ok);border-color:var(--ok);color:#fff}
  .step-btn.current{color:var(--navy);font-weight:700;background:var(--bg)}
  .step-btn.current .n{background:var(--red);border-color:var(--red);color:#fff}
  .progress{height:4px;background:var(--line);border-radius:2px;margin:10px 8px 4px;overflow:hidden}
  .progress i{display:block;height:100%;background:var(--red);transition:width .3s}
  .steps-foot{font-size:11.5px;color:var(--muted);padding:4px 8px 2px}
  @media (max-width:1000px){
    .stepper{top:calc(var(--topbar-h) + 10px);align-self:auto;padding:8px 10px}
    .steps-title,.step-btn .s,.steps-foot{display:none}
    .steps{flex-direction:row;overflow-x:auto;scrollbar-width:none}
    .steps::-webkit-scrollbar{display:none}
    .step-btn{width:auto;flex:0 0 auto;padding:5px 8px;font-size:12px;white-space:nowrap}
    .step-btn .t{display:none} .step-btn.current .t{display:inline}
    .progress{margin:8px 0 0}
  }

  /* step intro + nav */
  .step-intro .eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--red);margin-bottom:4px}
  .step-intro h1{margin:0 0 6px;font-size:22px;font-weight:700;color:var(--navy)}
  .step-intro p{margin:6px 0;color:#3c4556}
  .step-intro ul.todo{margin:8px 0 0 18px;padding:0;color:#3c4556}
  .step-intro li{margin:3px 0}
  .step-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0 40px}
  .step-nav .nav-pos{font-size:12px;color:var(--muted);text-align:center}
  .step-nav .btn{padding:9px 16px;font-weight:600}
  @media (max-width:700px){ .step-nav .btn{padding:8px 12px} }

  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
  .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 14px}
  @media (max-width:700px){ .grid2,.grid3{grid-template-columns:1fr} }
  .field label{display:block;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:4px}
  .field label .req{color:var(--red);margin-left:2px}
  .field .hint{font-size:11.5px;color:var(--muted);margin-top:3px}
  .field.changed input,.field.changed textarea{border-color:var(--warn);background:#fff9f0}
  .field.invalid input{border-color:var(--red);background:#fff5f5}
  .field .err{font-size:11.5px;color:var(--red);margin-top:3px;font-weight:500}

  h2.group{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px;display:flex;align-items:center;gap:10px}
  h2.group::after{content:"";flex:1;height:1px;background:var(--line)}
  h2.group .hint{font-weight:500;letter-spacing:0;text-transform:none;font-size:12px}

  /* fixed (non-editable) mat header */
  .fixed-header{background:var(--navy);color:#fff;border-radius:8px;padding:12px 14px 14px;text-align:center;border-bottom:3px solid var(--red)}
  .fixed-header .lock{display:inline-block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:#9fb0cc;background:rgba(255,255,255,.08);padding:3px 9px;border-radius:999px;margin-bottom:8px}
  .fixed-header b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em;text-transform:uppercase;line-height:1.1}
  .fixed-header b span{color:var(--red-bright);font-size:15px;margin-left:8px}
  .fixed-header small{display:block;font-size:10px;letter-spacing:.14em;font-weight:600;text-transform:uppercase;margin-top:6px}
  .fixed-header small.gst{color:#9fb0cc;letter-spacing:.1em;margin-top:3px}

  /* section card */
  .sec{border-left:6px solid var(--c,#999)}
  .sec-head{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .sec-head .title{flex:1;min-width:200px}
  .sec-head .title input{font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:14px}
  .sec-head .kind{font-size:11px;color:var(--muted);background:var(--bg);border-radius:999px;padding:3px 8px;white-space:nowrap}
  .sec-head.changed .title input{border-color:var(--warn);background:#fff9f0}
  .sec-head.new .title input{border-color:var(--ok);background:#f2fbf4}
  .sec-tools{display:flex;gap:4px;align-items:center}
  .sec-tools select{width:auto;padding:5px 26px 5px 8px;font-size:12px}
  .sec.collapsed .sec-body{display:none}
  .sec-body{padding:8px 12px 12px}
  .sec-extra{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
  @media (max-width:700px){ .sec-extra{grid-template-columns:1fr} }
  .sec-extra .full{grid-column:1/-1}
  .rows{display:flex;flex-direction:column;gap:4px}
  .rowhead{display:grid;gap:6px;align-items:center;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:0 0 2px}
  .row{display:grid;gap:6px;align-items:center;padding:3px 0;border-radius:6px;position:relative}
  .row.changed input[type=text],.row.changed textarea{border-color:var(--warn);background:#fff9f0}
  .row.new input[type=text],.row.new textarea{border-color:var(--ok);background:#f2fbf4}
  .row .mark{position:absolute;left:-13px;top:50%;transform:translateY(-50%);width:7px;height:7px;border-radius:50%;background:transparent}
  .row.changed .mark{background:var(--warn)} .row.new .mark{background:var(--ok)}
  .cols-list{grid-template-columns:28px minmax(0,1fr) 150px 76px 24px 24px 28px}
  .cols-guarantee{grid-template-columns:28px minmax(0,1fr) 170px 24px 24px 28px}
  .cols-packages{grid-template-columns:28px 44px minmax(0,1fr) minmax(0,1.4fr) 80px 100px 78px 24px 24px 28px}
  .cols-tiers{grid-template-columns:28px 110px 80px minmax(0,2fr) 90px 128px 24px 24px 28px}
  .cols-combos{grid-template-columns:28px minmax(0,1fr) minmax(0,1.6fr) 74px 74px 86px 110px 24px 24px 28px}
  @media (max-width:900px){
    .rowhead{display:none}
    .row{grid-template-columns:repeat(2,minmax(0,1fr)) !important;border:1px solid var(--line);padding:8px;margin-bottom:6px}
    .row > *{grid-column:auto}
    .row .idx{display:none}
  }
  .row .tools{display:contents}
  @media (max-width:900px){
    .row .tools{display:flex;grid-column:1/-1;justify-content:flex-end;gap:2px;border-top:1px dashed var(--line);padding-top:4px;margin-top:2px}
    .row .tools .ico{width:34px}
  }
  .idx{font-size:11px;color:var(--muted);text-align:right;padding-right:2px}
  .hl{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap}
  .hl input{accent-color:var(--red-bright)}
  .ico{width:24px;height:28px;border:none;background:transparent;border-radius:5px;cursor:pointer;color:var(--muted);padding:0;font-size:13px;line-height:1}
  .ico:hover{background:var(--bg);color:var(--ink)}
  .ico:disabled{opacity:.3;cursor:default}
  .ico:disabled:hover{background:transparent;color:var(--muted)}
  .ico.del:hover{color:var(--red);background:#fdeeef}
  .add-row{margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  input[type=color]{width:100%;height:34px;border:1px solid var(--line);border-radius:6px;padding:2px;background:#fff;cursor:pointer}
  .featured{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);white-space:nowrap}
  .add-sec{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 16px;border:1px dashed #c9ced9;border-radius:10px;background:transparent;color:var(--muted);margin-bottom:16px}
  .add-sec select{width:auto}
  .empty{border:1px dashed #c9ced9;border-radius:10px;padding:22px 16px;text-align:center;color:var(--muted);margin-bottom:16px;background:#fff}

  /* review step */
  .big-label{display:inline-flex;align-items:center;gap:8px;background:var(--navy);color:#fff;font-weight:800;text-transform:uppercase;letter-spacing:.1em;font-size:13px;padding:7px 14px;border-radius:6px;margin-bottom:8px}
  .big-label.example{background:var(--red)}
  .example-img{width:100%;display:block;border-radius:8px}
  .checks{display:flex;flex-direction:column}
  .check{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
  .check:last-child{border-bottom:none}
  .check i{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:800;color:#fff;background:var(--ok);line-height:1}
  .check.warn i{background:var(--warn)}
  .check span{flex:1;min-width:0}
  ol.changes{margin:6px 0 0 18px;padding:0;font-size:12.5px;color:#3c4556}
  ol.changes li{margin:3px 0}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
  .send-card{border-color:var(--navy);border-width:2px}
  .send-status{font-size:12.5px;color:var(--muted)}
  .send-status.error{color:var(--red);font-weight:500}
  .warn-note{background:#fff7ea;border:1px solid #f1d9ab;color:#7a4b06;border-radius:8px;padding:8px 12px;font-size:12.5px;margin:6px 0}
  .sent-banner{background:#eaf8ee;border:1px solid #b9e3c3;color:#155b2b;border-radius:8px;padding:10px 12px;font-size:13px;margin:0 0 10px}
  .mat-render-src{position:absolute;left:-20000px;top:0;width:1500px}
  .actions .btn{padding:9px 16px;font-weight:600}

  /* preview */
  .preview{position:sticky;top:calc(var(--topbar-h) + 20px);align-self:start;max-height:calc(100vh - var(--topbar-h) - 40px);overflow:auto;border-radius:10px;background:var(--navy-2);padding:12px;border:1px solid #0b152a}
  .preview h3{margin:0 0 10px;color:#9fb0cc;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
  .preview h3 span{color:var(--red-bright);font-weight:700}
  .pv-mat{background:var(--navy);border-radius:8px;padding:10px;color:#fff}
  .pv-header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:2px 4px 8px;border-bottom:2px solid var(--red);margin-bottom:8px;flex-wrap:wrap}
  .pv-header .logo{font-weight:800;letter-spacing:.02em;font-size:14px;text-transform:uppercase}
  .pv-header .logo i{display:block;font-size:9px;color:var(--red-bright);font-weight:600;letter-spacing:0}
  .pv-header .fixed{text-align:center;flex:1}
  .pv-header .fixed b{font-size:20px;font-weight:800;letter-spacing:-.02em;text-transform:uppercase}
  .pv-header .fixed b span{color:var(--red-bright);font-size:12px;margin-left:6px}
  .pv-header .fixed small{display:block;font-size:8px;letter-spacing:.14em;font-weight:600;text-transform:uppercase;color:#fff}
  .pv-header .fixed small.gst{color:#9fb0cc;letter-spacing:.1em;margin-top:2px}
  .pv-header .store{text-align:right;font-weight:800;text-transform:uppercase;font-size:13px;line-height:1.1;letter-spacing:.02em}
  .pv-grid{display:grid;grid-template-columns:1fr;gap:6px}
  .pv-col{border-radius:6px;transition:opacity .2s}
  .pv-mat.focus .pv-col:not(.active){opacity:.35}
  .pv-col.active{outline:2px solid var(--red-bright);outline-offset:4px}
  .pv-col-label{font-size:9px;color:#9fb0cc;letter-spacing:.14em;text-transform:uppercase;margin:6px 0 2px;font-weight:600}
  .pv-sec{background:var(--navy);border:1.5px solid var(--c);border-radius:6px;overflow:hidden;margin-bottom:6px;break-inside:avoid}
  .pv-head{background:var(--c);color:var(--fg);font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .pv-head .sub{display:block;font-size:8.5px;letter-spacing:.1em;font-weight:700}
  .pv-head .badge{background:var(--navy);color:#fff;font-size:8px;padding:2px 6px;border-radius:3px;letter-spacing:.06em;white-space:nowrap}
  .pv-rows{padding:4px 8px 5px}
  .pv-row{display:flex;justify-content:space-between;gap:10px;padding:1.5px 0;font-size:11.5px;line-height:1.3}
  .pv-row .l{flex:1}
  .pv-price{font-weight:700;letter-spacing:.05em;white-space:nowrap}
  .pv-price.hl{color:var(--red-bright)}
  .pv-note{color:var(--red-bright);font-size:9px;font-weight:700;text-transform:uppercase;padding:3px 8px 6px;white-space:pre-line;line-height:1.3}
  .pv-note::before{content:"★ "}
  .pv-note.plain{text-transform:none;font-weight:600}
  .pv-note.plain::before{content:""}
  .pv-pk{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:6px 8px 2px}
  .pv-pk .pk{background:#1f3357;border-radius:6px;padding:8px 6px;text-align:center}
  .pv-pk .pk.feat{background:#5cc4d8;color:var(--navy)}
  .pv-pk .num{display:inline-block;width:18px;height:18px;border-radius:50%;background:var(--ok);color:#fff;font-size:10px;font-weight:800;line-height:18px}
  .pv-pk .pk.feat .num{background:var(--navy)}
  .pv-pk .nm{font-weight:800;font-size:9.5px;text-transform:uppercase;color:#3fbf63;margin:4px 0;line-height:1.15}
  .pv-pk .pk.feat .nm{color:var(--navy)}
  .pv-pk .inc{font-size:9.5px;white-space:pre-line;line-height:1.25;min-height:36px}
  .pv-pk .pr{font-weight:800;font-size:16px;margin-top:4px}
  .pv-pk .sv{display:inline-block;background:var(--ok);color:#fff;font-size:8px;font-weight:700;padding:1px 5px;border-radius:3px;margin-left:4px;vertical-align:middle;letter-spacing:.04em}
  .pv-tier{display:grid;grid-template-columns:78px 1fr auto;gap:8px;align-items:center;background:#1f3357;margin:5px 8px;border-radius:6px;padding:7px 8px}
  .pv-tier .tb{background:var(--tc);color:#fff;font-weight:800;font-size:10px;text-transform:uppercase;padding:3px 6px;border-radius:999px;text-align:center;letter-spacing:.04em}
  .pv-tier .td{font-size:10px;white-space:pre-line;line-height:1.3}
  .pv-tier .tp{text-align:right;font-weight:800;font-size:15px;line-height:1}
  .pv-tier .tp small{display:block;font-size:8px;font-weight:600;letter-spacing:.06em;margin-top:3px;text-transform:uppercase}
  .pv-combos{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:8px}
  .pv-combo .ct{color:var(--red-bright);font-weight:800;text-transform:uppercase;font-size:11px;letter-spacing:.04em}
  .pv-combo .cd{font-size:10px;white-space:pre-line;line-height:1.3;margin:2px 0}
  .pv-combo .cp{font-weight:800;font-size:13px}
  .pv-combo .cp s{color:#9fb0cc;font-weight:600;font-size:11px;margin-right:5px}
  .pv-combo .cs{display:inline-block;background:var(--red);color:#fff;font-size:8px;font-weight:700;padding:1px 5px;border-radius:3px;margin-left:5px;vertical-align:middle}
  .pv-combo .cn{display:inline-block;background:var(--red);color:#fff;font-size:8px;font-weight:700;padding:1px 5px;border-radius:3px;margin-top:3px}
  .pv-guar{display:flex;flex-wrap:wrap;gap:4px 14px;padding:6px 8px 8px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
  .pv-guar span b{color:#fff}

  /* print: the mat is rendered offscreen at a fixed width, then scaled to fit one A4 landscape sheet */
  #print-root{position:fixed;left:-40000px;top:0;width:1500px;visibility:hidden;pointer-events:none}
  #print-fit{transform-origin:top left;width:1500px}
  /* full-width mat layout (5 columns + bottom band) – used for print and the review render */
  .mat-wide .pv-grid{grid-template-columns:repeat(5,1fr);gap:8px;align-items:start}
  .mat-wide .pv-band{grid-column:1/-1}
  .mat-wide .pv-combos{grid-template-columns:repeat(6,1fr)}
  .mat-wide .pv-header{padding:10px 12px 14px;margin-bottom:12px;border-bottom-width:4px}
  .mat-wide .pv-header .logo{font-size:30px}
  .mat-wide .pv-header .logo i{font-size:14px}
  .mat-wide .pv-header .fixed b{font-size:60px;line-height:1}
  .mat-wide .pv-header .fixed b span{font-size:34px;margin-left:12px}
  .mat-wide .pv-header .fixed small{font-size:14px;margin-top:6px}
  .mat-wide .pv-header .fixed small.gst{font-size:10px}
  .mat-wide .pv-header .store{font-size:28px}
  .mat-wide .pv-sec.kind-guarantee{display:flex;align-items:center;gap:24px;border:none;background:transparent;padding:6px 10px}
  .mat-wide .pv-sec.kind-guarantee .pv-head{background:transparent;color:var(--red-bright);font-size:54px;padding:0;letter-spacing:.02em;line-height:1;white-space:nowrap}
  .mat-wide .pv-sec.kind-guarantee .pv-guar{flex:1;display:grid;grid-template-columns:repeat(3,auto);gap:4px 26px;font-size:17px;padding:0}
  .mat-wide .pv-guar span b{color:#fff}
  /* review-step render: the wide mat scaled to fit the card */
  .mat-render-box{overflow:hidden;border-radius:8px;background:var(--navy-2);padding:0;position:relative}
  /* "Example only" watermark over the layout render */
  .mat-render-box::after{content:"Example only";position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;
    font-size:clamp(34px,9cqw,120px);font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,.32);
    -webkit-text-stroke:2px rgba(24,42,72,.5);text-shadow:0 2px 12px rgba(0,0,0,.35);transform:rotate(-16deg);white-space:nowrap}
  .mat-render-box{container-type:inline-size}
  .mat-render{width:1500px;transform-origin:top left}
  .mat-render .pv-col-label{display:none}
  .mat-render .pv-mat{border-radius:0}
  #print-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:11px;color:#333;margin:0 0 6px;height:22px}
  #print-head b{font-size:13px;color:#182a48}
  #print-brief{font-size:11px}
  #print-brief h2{font-size:15px;margin:0 0 6px}
  #print-brief table{border-collapse:collapse;width:100%;margin:6px 0}
  #print-brief td,#print-brief th{border:1px solid #bbb;padding:3px 6px;text-align:left;vertical-align:top;font-size:10.5px}
  #print-brief th{background:#eee}
  #print-brief .notes{white-space:pre-wrap;border:1px solid #bbb;padding:6px;background:#fafafa;margin:6px 0}
  @media print{
    @page{size:A4 landscape;margin:8mm}
    html,body{background:#fff;margin:0}
    .topbar,.layout,.toast{display:none !important}
    #print-root{position:static;left:auto;width:auto;visibility:visible;pointer-events:auto}
    #print-fit-box{overflow:hidden;break-inside:avoid}
    #print-brief{break-before:page}
    .pv-mat,.pv-sec,.pv-head,.pv-pk .pk,.pv-tier,.pv-combo,.pv-note{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:calc(100vw - 40px);text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header class="topbar" id="topbar">
  <div class="brand"><b>Mister Minit</b><span class="tag">Mat Builder</span></div>
  <span class="pill" id="pill-store">Store: <b>—</b></span>
  <span class="pill changes" id="pill-changes" hidden><b>0</b> changes from template</span>
  <div class="spacer"></div>
  <button class="btn" id="btn-reset" title="Put everything back to the template">Reset</button>
</header>

<main class="layout" id="layout">
  <nav class="stepper" id="stepper" aria-label="Steps"></nav>
  <div class="form" id="form">
    <div id="step-view"></div>
    <div class="step-nav" id="step-nav"></div>
  </div>

  <aside class="preview" id="preview">
    <h3 id="pv-title">Live preview (layout is approximate)</h3>
    <div id="pv"></div>
  </aside>
</main>

<div class="toast" id="toast"></div>

<!-- Print layout: page 1 = the mat fitted to A4 landscape, page 2 = changes list (only if there are any) -->
<div id="print-root" aria-hidden="true">
  <div id="print-head"></div>
  <div id="print-fit-box"><div id="print-fit" class="mat-wide"><div id="print-mat"></div></div></div>
  <div id="print-brief"></div>
</div>

const DEF_SEC = new Map(DEFAULT.sections.map(s => [s.id, s]));
const DEF_ITEM = new Map(); DEFAULT.sections.forEach(s => s.items.forEach(i => DEF_ITEM.set(i.id, i)));
const ITEM_KEYS = { list:["label","price","hl"], guarantee:["label","price"], packages:["num","label","desc","price","save","featured"], tiers:["label","color","desc","price","allow"], combos:["label","desc","was","price","save","note"] };

const KEY_NAME = { label:"text", price:"price", hl:"red highlight", desc:"description", save:"save badge", featured:"featured", num:"number", color:"colour", allow:"time", was:"was price", note:"note", title:"title", subtitle:"subtitle", badge:"badge", footnote:"footnote", column:"column" };
const norm = v => (typeof v === "boolean") ? v : String(v ?? "").trim();
const itemChanges = (sec, it) => { const d = DEF_ITEM.get(it.id); if (!d) return null; return ITEM_KEYS[sec.kind].filter(k => norm(it[k]) !== norm(d[k])); };
const secChanges = sec => { const d = DEF_SEC.get(sec.id); if (!d) return null; return SEC_KEYS.filter(k => norm(sec[k]) !== norm(d[k])); };
const findSec = id => state.sections.find(s => s.id === id);
const storeName = () => [state.meta.store1, state.meta.store2].filter(Boolean).join(" ");

if (!ui || typeof ui.step !== "number" || !Array.isArray(ui.done)) ui = { step:0, done:[] };
ui.step = Math.min(Math.max(0, ui.step | 0), STEPS.length - 1);
const saveUi = () => { try { localStorage.setItem(UI_KEY, JSON.stringify(ui)); } catch(e) {} };

const $ = sel => document.querySelector(sel);

function tf(sec, it, key, ph, extra="") {

const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

function reviewChecks() {

  // bring the part of the mat being edited into view in the preview
  const aside = $("#preview"), active = pv.querySelector(".pv-col.active");
  $("#pv-title").innerHTML = s.col ? `Live preview · <span>${esc(s.label)}</span> highlighted` : "Live preview (layout is approximate)";
  if (active && aside.scrollHeight > aside.clientHeight) aside.scrollTo({ top: Math.max(0, active.offsetTop - 40), behavior:"smooth" });
  else aside.scrollTo({ top:0 });
}
/* scale the 1500px-wide mat render down to the width of its card */
function fitRender() {
  const r = $("#mat-render"), box = $("#mat-render-box"); if (!r || !box) return;
  r.style.transform = "none"; box.style.height = "auto";
  const sc = Math.min(1, box.clientWidth / r.offsetWidth), H = r.offsetHeight;
  r.style.transform = `scale(${sc})`; box.style.height = Math.ceil(H * sc) + "px";
}
window.addEventListener("resize", fitRender);
function markMeta(el) {
  const k = el.dataset.meta, fld = el.closest(".field");
  if (!fld) return;
  fld.classList.toggle("changed", ["store1","store2"].includes(k) && norm(state.meta[k]) !== norm(DEFAULT.meta[k]));
}
function clearInvalid(fld) { if (!fld) return; fld.classList.remove("invalid"); fld.querySelector(".err")?.remove(); }
/* Step 1 must have a store name and a way to contact the store before moving on */
function validateStore() {
  const m = state.meta, errs = [];
  if (!norm(m.store1)) errs.push(["store1", "Please enter your store name"]);
  if (!norm(m.contactName)) errs.push(["contactName", "Please enter a contact name"]);
  if (!norm(m.contactEmail)) errs.push(["contactEmail", "Please enter your email address – your copy of the brief goes here"]);
  else if (!EMAIL_RE.test(norm(m.contactEmail))) errs.push(["contactEmail", "That doesn't look like an email address"]);
  document.querySelectorAll(".field.invalid").forEach(clearInvalid);
  for (const [k, msg] of errs) {
    const fld = document.querySelector(`[data-meta="${k}"]`)?.closest(".field");
    if (fld) { fld.classList.add("invalid"); fld.insertAdjacentHTML("beforeend", `<div class="err">${msg}</div>`); }
  }
  if (errs.length) {
    document.querySelector(".field.invalid")?.scrollIntoView({ behavior:"smooth", block:"center" });
    document.querySelector(".field.invalid input")?.focus({ preventScroll:true });
    toast("A few details are needed before you continue");
    return false;
  }
  return true;
}
function goTo(i, viaNext=false) {
  if (i < 0 || i >= STEPS.length || i === ui.step) return;
  if (i > ui.step && cur().id === "store" && !validateStore()) return;
  if (viaNext) markDone(cur().id);
  ui.step = i; saveUi(); renderStep(); updateCount();
  window.scrollTo({ top:0, behavior:"smooth" });
}

/* ===================== EVENTS ===================== */
form.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.meta) {
    if (FIXED_META.includes(t.dataset.meta)) return;
    state.meta[t.dataset.meta] = t.value; markMeta(t); clearInvalid(t.closest(".field"));
  }
  else if (t.dataset.sec) {
    const sec = findSec(t.dataset.sec); if (!sec) return;
    const val = t.type === "checkbox" ? t.checked : t.value;
    if (t.dataset.item) {
      const it = sec.items.find(i => i.id === t.dataset.item); if (!it) return;
      it[t.dataset.key] = val;
      const row = t.closest(".row"); row.classList.remove("changed","new"); const c = rowClass(sec, it); if (c) row.classList.add(c);
    } else {
      sec[t.dataset.key] = val;
      if (t.dataset.key === "column") {
        save(); updateCount();
        const idx = stepIndex("col:" + val);
        toast(`Moved "${sec.title || "section"}" to step ${idx+1}: ${STEPS[idx].label}`);
        renderStep(); return;
      }
      if (t.dataset.key === "color") { save(); renderStep(); updateCount(); return; }
      const head = t.closest(".sec-head"); if (head) { head.classList.remove("changed","new"); const sc = secChanges(sec); head.classList.add(sc===null?"new":(sc.length?"changed":"")); }
    }
  } else return;
  save(); renderPreview(); updateCount();
});
function onClick(e) {
  const g = e.target.closest("[data-goto]");
  if (g) { goTo(+g.dataset.goto, g.hasAttribute("data-advance")); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  if (act === "add-sec") return addSection(b.dataset.col);
  if (act === "submit") return submitBrief();
  const sec = findSec(b.dataset.sec); if (!sec) return;
  const idx = state.sections.indexOf(sec);
  const items = sec.items, ii = items.findIndex(i => i.id === b.dataset.item);
  const swap = (arr, a, b2) => { [arr[a], arr[b2]] = [arr[b2], arr[a]]; };
  // neighbours within the same part of the mat, so "move up/down" behaves as shown on screen
  const same = state.sections.filter(s => s.column === sec.column), p = same.indexOf(sec);
  switch (act) {
    case "toggle": collapsed.has(sec.id) ? collapsed.delete(sec.id) : collapsed.add(sec.id); break;
    case "add-item": items.push(blankItem(sec.kind)); collapsed.delete(sec.id); break;
    case "del-item": if (confirm(`Remove "${items[ii].label || "this line"}"?`)) items.splice(ii, 1); break;
    case "up-item": if (ii > 0) swap(items, ii, ii-1); break;
    case "down-item": if (ii < items.length-1) swap(items, ii, ii+1); break;
    case "del-sec": if (confirm(`Remove the whole "${sec.title}" section?`)) state.sections.splice(idx, 1); break;
    case "up-sec": if (p > 0) swap(state.sections, idx, state.sections.indexOf(same[p-1])); break;
    case "down-sec": if (p < same.length-1) swap(state.sections, idx, state.sections.indexOf(same[p+1])); break;
  }
  save(); renderStep(); updateCount();
  if (act === "add-item") { const rows = document.querySelectorAll(`[data-sec-card="${sec.id}"] .row`); const last = rows[rows.length-1]; last?.querySelector("input[type=text]")?.focus(); }
}
form.addEventListener("click", onClick);
$("#stepper").addEventListener("click", onClick);
function blankItem(kind) {
  const id = uid();
  if (kind === "packages") return { id, num:"", label:"", desc:"", price:"", save:"", featured:false };
  if (kind === "tiers") return { id, label:"", color:"#1e5fa8", desc:"", price:"", allow:"" };
  if (kind === "combos") return { id, label:"", desc:"", was:"", price:"", save:"", note:"" };
  return { id, label:"", price:"", hl:false };
}
function addSection(column) {
  const kind = $("#new-kind")?.value || "list";
  const sec = { id:uid(), title:"", color: kind==="combos"?"blue":"orange", column, kind, subtitle:"", badge:"", footnote:"", items:[blankItem(kind)] };
  state.sections.push(sec); save(); renderStep(); updateCount();
  const el = document.querySelector(`[data-sec-card="${sec.id}"]`); el?.scrollIntoView({behavior:"smooth", block:"center"}); el?.querySelector(".title input")?.focus({ preventScroll:true });
}
$("#btn-reset").addEventListener("click", () => {
  if (!confirm("Reset everything back to the template? Your changes in this browser will be lost.")) return;
  state = clone(DEFAULT); normalizeState(); collapsed.clear(); ui = { step:0, done:[] };
  save(); saveUi(); renderStep(); updateCount(); toast("Reset to template");
  window.scrollTo({ top:0 });
});
let toastT; function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 3200); }

/* ===================== SUBMIT ===================== */
function loadScript(src) {
  return new Promise((ok, fail) => {
    if (document.querySelector(`script[src="${src}"]`)) return ok();
    const el = document.createElement("script"); el.src = src; el.onload = ok; el.onerror = () => fail(new Error("Couldn't load the image library")); document.head.appendChild(el);
  });
}
/* Rasterise the full-width mat (1500px layout at 2x) so the designer gets a high-quality render */
async function renderMatImage() {
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js");
  const host = document.createElement("div");
  host.className = "mat-wide mat-render-src"; host.innerHTML = matHTML(null);
  document.body.appendChild(host);
  try {
    const canvas = await html2canvas(host, {
      scale: 2, backgroundColor: "#182a48", useCORS: true, logging: false, windowWidth: 1600,
      onclone: doc => { const h = doc.querySelector(".mat-render-src"); if (h) h.style.left = "0"; }
    });
    // Graph's sendMail request must stay under ~4 MB, so prefer PNG only while it's small enough
    let url = canvas.toDataURL("image/png");
    if (url.length > 2_400_000) url = canvas.toDataURL("image/jpeg", 0.92);
    return { dataUrl: url, width: canvas.width, height: canvas.height };
  } finally { host.remove(); }
}
/* Everything the designer needs, plus per-line status (changed / new) so the email can flag it */
function buildPayload(image) {
  const sections = state.sections.map(sec => {
    const sch = secChanges(sec);
    return {
      ...sec,
      status: sch === null ? "new" : (sch.length ? "changed" : ""),
      changedFields: sch || [],
      items: sec.items.map(it => { const ch = itemChanges(sec, it); return { ...it, status: ch === null ? "new" : (ch.length ? "changed" : ""), changedFields: ch || [] }; })
    };
  });
  return {
    meta: state.meta, sections, changes: diff(),
    lookup: { columns: COLUMNS.map(([key, name, theme]) => ({ key, name, theme })), colors: Object.fromEntries(Object.entries(PALETTE).map(([k, p]) => [k, p.name])), kinds: KIND_NAME },
    template: "Mister Minit Mat-CMYK-Outlined.pdf",
    submittedAt: new Date().toISOString(),
    page: location.href,
    image
  };
}
let sending = false;
async function submitBrief() {
  if (sending) return;
  if (!storeValid()) { toast("Please complete your store details first"); goTo(0); setTimeout(validateStore, 450); return; }
  const btn = $("#btn-submit"), st = $("#send-status");
  sending = true; btn.disabled = true; st.className = "send-status"; st.textContent = "Preparing your layout…";
  try {
    const image = await renderMatImage();
    st.textContent = "Sending…";
    const payload = buildPayload(image);
    const r = await fetch(SUBMIT_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
    const data = await r.json().catch(() => ({}));
    if (!r.ok || !data.ok) throw new Error(data.error || `the server replied ${r.status}`);
    ui.submittedAt = payload.submittedAt; saveUi();
    sending = false; renderStep(); updateCount();
    $("#send-card")?.scrollIntoView({ behavior: "smooth", block: "center" });
    toast(`Brief sent – a copy is on its way to ${state.meta.contactEmail}`);
  } catch (err) {
    sending = false; btn.disabled = false;
    st.className = "send-status error"; st.textContent = `Couldn't send: ${err.message}. Please try again, or contact us if it keeps happening.`;
  }
}

/* ===================== DIFF / SUMMARY ===================== */
const fmtItem = (kind, it) => {
  if (kind === "packages") return `${it.num} ${it.label} — ${it.price} (${it.save})${it.featured?" [featured]":""}: ${(it.desc||"").replace(/\n/g," / ")}`;
  if (kind === "tiers") return `${it.label} — ${it.price} ${it.allow||""}: ${(it.desc||"").replace(/\n/g," / ")}`.trim();
  if (kind === "combos") return `${it.label} — was ${it.was} now ${it.price} (${it.save})${it.note?" · "+it.note:""}: ${(it.desc||"").replace(/\n/g," / ")}`;
  return `${it.label} — ${it.price}${it.hl?" [red]":""}`;
};
const showVal = v => typeof v === "boolean" ? (v ? "on" : "off") : `"${String(v ?? "").replace(/\n/g," / ")}"`;
function diff() {
  const out = [];
  for (const [k, name] of [["store1","line 1"],["store2","line 2"]]) if (norm(state.meta[k]) !== norm(DEFAULT.meta[k])) out.push(`Store name · ${name}: was ${showVal(DEFAULT.meta[k])}, now ${showVal(state.meta[k])}`);
  const cur = new Map(state.sections.map(s => [s.id, s]));
  for (const ds of DEFAULT.sections) if (!cur.has(ds.id)) out.push(`REMOVED SECTION: ${ds.title}`);
  for (const s of state.sections) {
    const ds = DEF_SEC.get(s.id);
    if (!ds) { out.push(`NEW SECTION: ${s.title || "(untitled)"} [${KIND_NAME[s.kind]}, ${colName(s.column)}, ${PALETTE[s.color]?.name}] with ${s.items.length} line(s)`); continue; }
    for (const k of SEC_KEYS) if (norm(s[k]) !== norm(ds[k])) out.push(`${ds.title} · ${KEY_NAME[k]}: was ${k==="color"?PALETTE[ds[k]]?.name:k==="column"?colName(ds[k]):showVal(ds[k])}, now ${k==="color"?PALETTE[s[k]]?.name:k==="column"?colName(s[k]):showVal(s[k])}`);
    const have = new Set(s.items.map(i => i.id));
    for (const di of ds.items) if (!have.has(di.id)) out.push(`${ds.title} · REMOVED line: ${fmtItem(s.kind, di)}`);
    for (const it of s.items) {
      const ch = itemChanges(s, it);
      if (ch === null) out.push(`${s.title} · ADDED line: ${fmtItem(s.kind, it)}`);
      else if (ch.length) { const di = DEF_ITEM.get(it.id); out.push(`${s.title} · "${di.label}": ` + ch.map(k => `${KEY_NAME[k]} was ${showVal(di[k])}, now ${showVal(it[k])}`).join("; ")); }
    }
  }
  return out;
}
function updateCount() {
  const n = diff().length, p = $("#pill-changes");
  p.hidden = n === 0; p.querySelector("b").textContent = n;
  $("#pill-store").innerHTML = `Store: <b>${esc(storeName() || "—")}</b>`;
}
/* ===================== PREVIEW ===================== */
/* activeCol: highlight that part of the mat (used on screen while editing; not for print) */
function matHTML(activeCol) {
  const m = state.meta;
  let html = `<div class="pv-mat ${activeCol ? "focus" : ""}"><div class="pv-header">
    <div class="logo">Mister Minit<i>'Real people fixing problems'</i></div>
    <div class="fixed"><b>${esc(m.headline1)}<span>${esc(m.headline2)}</span></b><small>${esc(m.tagline)}</small><small class="gst">${esc(m.gst)}</small></div>
    <div class="store">${esc(m.store1)}<br>${esc(m.store2)}</div></div><div class="pv-grid">`;
  for (const [col, name] of COLUMNS) {
    const secs = state.sections.filter(s => s.column === col); if (!secs.length) continue;
    html += `<div class="pv-col ${col==="bottom"?"pv-band":""} ${activeCol===col?"active":""}"><div class="pv-col-label">${name}</div>${secs.map(pvSection).join("")}</div>`;
  }
  return html + `</div></div>`;
}
function renderPreview() { pv.innerHTML = matHTML(cur().col); }
function pvSection(s) {
  const pal = PALETTE[s.color] || PALETTE.orange;
  let body = "";
  if (s.kind === "list" || s.kind === "guarantee") {
    if (s.kind === "guarantee") body = `<div class="pv-guar">${s.items.map(i => `<span>${esc(i.label)} • <b>${esc(i.price)}</b></span>`).join("")}</div>`;
    else body = `<div class="pv-rows">${s.items.map(i => `<div class="pv-row"><span class="l">${esc(i.label)}</span><span class="pv-price ${i.hl?"hl":""}">${esc(i.price)}</span></div>`).join("")}</div>`;
  } else if (s.kind === "packages") {
    body = `<div class="pv-pk">${s.items.map(i => `<div class="pk ${i.featured?"feat":""}"><span class="num">${esc(i.num)}</span><div class="nm">${esc(i.label)}</div><div class="inc">${esc(i.desc)}</div><div class="pr">${esc(i.price)}${i.save?`<span class="sv">${esc(i.save)}</span>`:""}</div></div>`).join("")}</div>`;
  } else if (s.kind === "tiers") {
    body = s.items.map(i => `<div class="pv-tier" style="--tc:${esc(i.color||"#1e5fa8")}"><span class="tb">${esc(i.label)}</span><div class="td">${esc(i.desc)}</div><div class="tp">${esc(i.price)}<small>${esc(i.allow)}</small></div></div>`).join("") + `<div style="height:5px"></div>`;
  } else if (s.kind === "combos") {
    body = `<div class="pv-combos">${s.items.map(i => `<div class="pv-combo"><div class="ct">${esc(i.label)}</div><div class="cd">${esc(i.desc)}</div><div class="cp"><s>${esc(i.was)}</s>${esc(i.price)}${i.save?`<span class="cs">${esc(i.save)}</span>`:""}</div>${i.note?`<span class="cn">${esc(i.note)}</span>`:""}</div>`).join("")}</div>`;
  }
  const foot = s.footnote ? `<div class="pv-note ${s.footnotePlain||s.footnote.length>70?"plain":""}">${esc(s.footnote)}</div>` : "";
  return `<div class="pv-sec kind-${s.kind}" style="--c:${pal.bg};--fg:${pal.fg}"><div class="pv-head"><span>${esc(s.title)}${s.subtitle?`<span class="sub">${esc(s.subtitle)}</span>`:""}</span>${s.badge?`<span class="badge">${esc(s.badge)}</span>`:""}</div>${body}${foot}</div>`;
}
/* Build the print pages and scale the mat to fit one A4 landscape sheet */
const PAGE = { w: 1062, h: 733, head: 30 };   // A4 landscape minus 8 mm margins, in CSS px
function preparePrint() {
  const m = state.meta, d = diff(), store = [m.store1, m.store2].filter(Boolean).join(" / ");
  $("#print-mat").innerHTML = matHTML(null);
  $("#print-head").innerHTML = `<b>Mister Minit price mat brief — ${esc(store)}</b><span>Contact: ${esc(m.contactName||"-")} ${esc(m.contactEmail||"")} ${esc(m.contactPhone||"")}${m.matSize?` · Mat: ${esc(m.matSize)}`:""} · ${d.length} change${d.length===1?"":"s"} from template${d.length||m.notes.trim()?" (see page 2)":""} · ${new Date().toLocaleDateString()}</span>`;
  const fit = $("#print-fit"), box = $("#print-fit-box");
  fit.style.transform = "none"; box.style.width = box.style.height = "auto";
  const W = fit.offsetWidth, H = fit.offsetHeight;
  const sc = Math.min(PAGE.w / W, (PAGE.h - PAGE.head) / H, 1);
  fit.style.transform = `scale(${sc})`; box.style.width = Math.floor(W * sc) + "px"; box.style.height = Math.floor(H * sc) + "px";
  const brief = $("#print-brief");
  brief.hidden = !(d.length || m.notes.trim());
  brief.innerHTML = `<h2>Changes from template — ${esc(store)}</h2>
    ${m.notes.trim() ? `<b>Notes for the designer</b><div class="notes">${esc(m.notes.trim())}</div>` : ""}
    <table><tr><th style="width:30px">#</th><th>Change (${d.length})</th></tr>${d.length ? d.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x)}</td></tr>`).join("") : `<tr><td>–</td><td>No content changes.</td></tr>`}</table>`;
}
window.addEventListener("beforeprint", preparePrint);

/* ===================== INIT ===================== */
/* sticky stepper + preview sit just below the top bar, whatever height it wraps to */
const topbar = $("#topbar");
const setTopbarHeight = () => document.documentElement.style.setProperty("--topbar-h", topbar.offsetHeight + "px");
setTopbarHeight(); window.addEventListener("resize", setTopbarHeight); window.addEventListener("load", setTopbarHeight);
renderStep(); updateCount();
if (location.hash === "#print") { preparePrint(); }   // lets the page be rendered straight to PDF (e.g. headless Chrome)
</script>
</body>
